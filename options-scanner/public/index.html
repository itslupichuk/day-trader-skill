<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scanner">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>Options Scanner</title>
<style>
:root{--bg:#0b0f14;--card:#151b23;--tx:#e8edf2;--mu:#8b97a5;--g:#3ddc97;--r:#ff6b6b;--y:#ffd166;--bd:#243040}
@media(prefers-color-scheme:light){:root{--bg:#f4f6f8;--card:#fff;--tx:#10161d;--mu:#5d6a78;--g:#0a9d62;--r:#d33;--y:#a67300;--bd:#dde3ea}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px -apple-system,system-ui,sans-serif;padding:max(12px,env(safe-area-inset-top)) 16px 40px}
h1{font-size:20px;margin:6px 0 2px}.sub{color:var(--mu);font-size:12px}
.warn{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--y);padding:10px;border-radius:8px;font-size:12px;color:var(--mu);margin:10px 0}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
label{font-size:11px;color:var(--mu);display:block}input{width:100%;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.full{grid-column:1/3}button{width:100%;padding:12px;border-radius:10px;border:0;background:var(--g);color:#04130c;font-weight:700;font-size:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.h{display:flex;justify-content:space-between;align-items:baseline}.sym{font-weight:700;font-size:17px}
.call{color:var(--g)}.put{color:var(--r)}.mu{color:var(--mu);font-size:12px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.g div{font-size:11px;color:var(--mu)}.g b{display:block;color:var(--tx);font-size:14px}
.occ{font:11px ui-monospace,monospace;color:var(--mu);margin-top:6px;word-break:break-all}
.sc{margin-top:8px;font-size:12px;border-top:1px solid var(--bd);padding-top:8px}
</style></head><body>
<h1>Options Scanner</h1><div class="sub" id="meta">Short-dated OTM lottery tickets</div>
<div class="warn"><b>Read this.</b> Cheap short-dated OTM options usually expire worthless. The "% to profit" figure is a model estimate from implied volatility, not a prediction. Size every ticket at an amount you can lose entirely. Not financial advice.</div>
<div class="ctl">
<div><label>Budget $</label><input id="budget" type="number" inputmode="decimal" value="1000"></div>
<div><label>Max days to expiry</label><input id="maxDte" type="number" inputmode="numeric" value="7"></div>
<div><label>Max ask $/share</label><input id="maxAsk" type="number" inputmode="decimal" value="3"></div>
<div><label>Max spread %</label><input id="spread" type="number" inputmode="numeric" value="30"></div>
<div class="full"><label>Tickers (comma separated)</label><input id="symbols" value="SPY,QQQ,IWM,NVDA,TSLA,AAPL,AMD,META,AMZN,PLTR,MSFT,GOOGL,COIN,MSTR"></div>
<div class="full"><button id="go">Scan now</button></div></div>
<div id="out"></div>
<script>
const $=id=>document.getElementById(id), usd=n=>'$'+Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
for(const k of ['budget','maxDte','maxAsk','spread','symbols']){const v=localStorage.getItem('os_'+k);if(v)$(k).value=v}
async function run(){
  $('go').textContent='Scanning…';$('go').disabled=true;
  for(const k of ['budget','maxDte','maxAsk','spread','symbols'])localStorage.setItem('os_'+k,$(k).value);
  const q=new URLSearchParams({budget:$('budget').value,maxDte:$('maxDte').value,maxAsk:$('maxAsk').value,maxSpreadPct:$('spread').value/100,symbols:$('symbols').value});
  try{
    const d=await (await fetch('/api/scan?'+q)).json();
    $('meta').textContent=`${d.provider==='demo'?'DEMO DATA (synthetic) · ':''}${d.count} matches · ${new Date(d.asOf).toLocaleTimeString()}`;
    $('out').innerHTML=(d.errors.length?`<div class="warn">${d.errors.map(e=>e.replace(/</g,'&lt;')).join('<br>')}</div>`:'')+
    d.results.map((r,i)=>`<div class="c"><div class="h"><span class="sym">${i+1}. ${r.underlying} <span class="${r.type}">${usd(r.strike)} ${r.type.toUpperCase()}</span></span><span class="mu">${r.expiry} · ${r.dte}d</span></div>
    <div class="g"><div>Ask<b>${usd(r.ask)}</b></div><div>Per contract<b>${usd(r.costPerContract)}</b></div><div>Buy ${r.contracts}×<b>${usd(r.totalCost)}</b></div>
    <div>Spot → B/E<b>${usd(r.spot)} → ${usd(r.breakeven)}</b></div><div>Move needed<b>${r.movePct}% (${r.sigmasToBreakeven}σ)</b></div><div>Model P(profit)<b>${r.probProfitPct}%</b></div>
    <div>Delta<b>${r.delta}</b></div><div>IV<b>${r.ivPct}%</b></div><div>Spread<b>${r.spreadPct}%</b></div></div>
    <div class="sc">If ${r.underlying} hits ${usd(r.scenarios.s1.price)} (1σ): <b>${r.scenarios.s1.multiple.toFixed(1)}×</b> · ${usd(r.scenarios.s15.price)} (1.5σ): <b>${r.scenarios.s15.multiple.toFixed(1)}×</b> · ${usd(r.scenarios.s2.price)} (2σ): <b>${r.scenarios.s2.multiple.toFixed(1)}×</b> <span class="mu">(value at expiry)</span></div>
    <div class="occ">${r.contract}</div></div>`).join('')||'<div class="warn">No contracts matched. Loosen filters or try during market hours.</div>';
  }catch(e){$('out').innerHTML='<div class="warn">'+e.message+'</div>'}
  $('go').textContent='Scan now';$('go').disabled=false;
}
$('go').onclick=run;run();
</script></body></html>
